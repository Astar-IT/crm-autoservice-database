name: Update Submodules in Services

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Продолжать даже если один job упал
      matrix:
        repo: [crm-autoservice-auth, crm-autoservice-api, crm-autoservice-web]
    
    steps:
      - name: Checkout service repo
        uses: actions/checkout@v4
        with:
          repository: AlexKutepov/${{ matrix.repo }}
          token: ${{ secrets.GH_PAT }}
          submodules: recursive
          fetch-depth: 0
      
      - name: Update database submodule
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git submodule sync --recursive
          git submodule update --init --remote database
          git add database
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update database submodule"
            git push
          fi
